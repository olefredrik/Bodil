# Fixture for avsetningsmodellen (Bodil ≥ 1.0.0).
#
# Dekker den kombinasjonen som gjør modellen ikke-triviell, og som Wenche 1.5.1
# er skrevet for: selskapet betaler ut FJORÅRETS avsetning (10 000) og avsetter
# ET NYTT utbytte for inneværende år (8 000) i samme regnskapsår.
#
# Det gir to poster som er lette å forveksle:
#   avsatt_utbytte    = 8 000   (gjeld per 31.12, reduserer egenkapitalen i år)
#   utbytte_utbetalt  = 10 000  (kontanter ut i år, gjør opp fjorårets gjeld)
#
# Egenkapitalavstemmingen skal derfor vise avsattEllerForventetUtbytte på 8 000, og
# IKKE en utbyttepost for de 10 000: de traff egenkapitalen i fjor. Egenkapitalen
# faller likevel ikke, siden årsresultatet på 12 320 er større enn avsetningen.
#
# Tallene følger config.golden.yaml (utbytte 12 500, eierandel 25 %, skatt 55) slik at
# de to fixturene er direkte sammenlignbare på alt annet enn utbyttehåndteringen.
#
# KUN syntetiske data. Aldri ekte fødselsnummer her (fila versjoneres).

