# Fixture for et holdingselskap med et heleid datterselskap.
#
# Golden-fixturet har en eierpost på 25 %, som står under andre_aksjer og gir
# 3 %-sjablonbeskatning av utbyttet. Denne dekker det vanligste holdingtilfellet:
# selskapet eier 100 % av datterselskapet. Det har kontroll (rskl. § 1-3), så
# kostprisen står under aksjer_i_datterselskap, og Wenche oppgir selskapet som
# morselskap i årsregnskapet. Eierandelen er over 90 %, så utbyttet på 12 500 er
# fullt skattefritt etter fritaksmetoden, og skattekostnaden er 0.
#
# Året: utbytte 12 500 inn, bankgebyrer 125 ut, ingen utbetaling til eier.
# Bank 30 000 + 12 500 - 125 = 42 375. Årsresultat 12 375 til annen egenkapital.
#
# KUN syntetiske data. Aldri ekte fødselsnummer her (fila versjoneres).

