# Fixture for leverandørgjeld ved årsskiftet.
#
# En faktura fra regnskapsfører på 1 500 for 2024 ble betalt i januar 2025. Den sto som
# leverandørgjeld 31.12.2024, og betalingen i 2025 reduserer gjelden i stedet for å bli en
# ny kostnad. En ny faktura på 1 200 for 2025 er ubetalt per 31.12.2025 og føres som
# kostnad i 2025 med leverandørgjeld som motpost.
#
# Andre driftskostnader 2025 = bankgebyrer 125 + ubetalt faktura 1 200 = 1 325.
# Bank 30 000 − 125 − 1 500 = 28 375. Leverandørgjeld 31.12 = 1 500 − 1 500 + 1 200 = 1 200.
# Fremført underskudd 01.01 er fjorårets 1 500, og Wenche skal beregne 2 825 til fremføring.
#
# KUN syntetiske data. Aldri ekte fødselsnummer her (fila versjoneres).

